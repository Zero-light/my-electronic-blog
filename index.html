<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E8F0FF" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <title>WordPal — 词友</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #E8F0FF 0%, #D5E8FF 50%, #FFE5F1 100%);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #game {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; image-rendering: auto; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; z-index: 10;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid rgba(124, 156, 248, 0.3);
      border-top-color: #7C9CF8;
      animation: spin 1s linear infinite;
    }
    #loading-text { font-family: sans-serif; color: #7C9CF8; font-size: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-text">正在准备好朋友...</div>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
