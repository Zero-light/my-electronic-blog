<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#D6EAFA" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>WordPal — 词友</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #D6EAFA 0%, #C5DDF5 40%, #FFE8EE 100%);
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #game {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: auto;
      border-radius: 12px;
      box-shadow: 0 8px 60px rgba(139, 184, 208, 0.15);
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px; z-index: 10;
      background: linear-gradient(135deg, #D6EAFA 0%, #C5DDF5 40%, #FFE8EE 100%);
      transition: opacity 0.6s ease;
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-spinner {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.4);
      position: relative;
    }
    #loading-spinner::after {
      content: '';
      position: absolute;
      inset: 3px; border-radius: 50%;
      border: 3px solid rgba(139,184,208,0.2);
      border-top-color: #8BB8D0;
      animation: spin 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    #loading-text {
      font-size: 16px; font-weight: 500; color: rgba(61,61,92,0.6); letter-spacing: 0.5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-spinner"></div>
    <div id="loading-text">正在准备好朋友...</div>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
